alias: 'Tagreader: Set LED color'
description: ''
triggers:
  - entity_id:
      - alarm_control_panel.alarmo
    to: armed_away
    id: armed_away
    trigger: state
  - entity_id:
      - alarm_control_panel.alarmo
    to: armed_night
    id: armed_night
    trigger: state
  - entity_id:
      - alarm_control_panel.alarmo
    to: disarmed
    id: disarmed
    trigger: state
  - entity_id:
      - alarm_control_panel.alarmo
    to: arming
    id: arming
    trigger: state
  - entity_id:
      - alarm_control_panel.alarmo
    to: pending
    id: pending
    trigger: state
  - entity_id:
      - alarm_control_panel.alarmo
    to: triggered
    id: triggered
    trigger: state
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: triggered
        sequence:
          - repeat:
              while:
                - condition: state
                  entity_id: alarm_control_panel.alarmo
                  state: triggered
              sequence:
                - data:
                    color_name: red
                    brightness: 255
                  target:
                    entity_id:
                      - light.tagreader_garage_led
                      - light.tagreader_bedroom_led
                      - light.tagreader_frontdoor_led
                  continue_on_error: true
                  action: light.turn_on
                - delay:
                    milliseconds: 500
                - target:
                    entity_id:
                      - light.tagreader_garage_led
                      - light.tagreader_bedroom_led
                      - light.tagreader_frontdoor_led
                  continue_on_error: true
                  action: light.turn_off
                - delay:
                    milliseconds: 500
      - conditions:
          - condition: trigger
            id: disarmed
        sequence:
          - type: turn_off
            device_id: 9fe061d2ca212299232a65589489f7cb
            entity_id: light.tagreader_garage_led
            domain: light
          - type: turn_off
            device_id: 6d89936e9ec001024f51617b7bcdd64c
            entity_id: light.tagreader_bedroom_led
            domain: light
          - type: turn_off
            device_id: 765cf27c0545a25140023e7c08010935
            entity_id: light.tagreader_frontdoor_led
            domain: light
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: armed_away
              - condition: trigger
                id: armed_night
        sequence:
          - data:
              color_name: red
              brightness: 255
            target:
              entity_id:
                - light.tagreader_garage_led
                - light.tagreader_bedroom_led
                - light.tagreader_frontdoor_led
            action: light.turn_on
          - data:
              color_name: red
              brightness: 35
            target:
              entity_id:
                - light.tagreader_bedroom_led
            action: light.turn_on
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: arming
              - condition: trigger
                id: pending
        sequence:
          - repeat:
              until:
                - condition: or
                  conditions:
                    - condition: state
                      entity_id: alarm_control_panel.alarmo
                      state: armed_away
                    - condition: state
                      entity_id: alarm_control_panel.alarmo
                      state: armed_night
              sequence:
                - data:
                    rgb_color:
                      - 254
                      - 252
                      - 221
                  target:
                    entity_id:
                      - light.tagreader_garage_led
                      - light.tagreader_bedroom_led
                      - light.tagreader_frontdoor_led
                  action: light.turn_on
                - data:
                    song_str: Beep:d=32,o=6,b=100:8g
                  continue_on_error: true
                  action: esphome.tagreader_garage_play_rtttl
                - data:
                    song_str: Beep:d=32,o=6,b=100:8g
                  continue_on_error: true
                  action: esphome.tagreader_bedroom_play_rtttl
                - data:
                    song_str: Beep:d=32,o=6,b=100:8g
                  continue_on_error: true
                  action: esphome.tagreader_frontdoor_play_rtttl
                - delay:
                    hours: 0
                    minutes: 0
                    seconds: 1
                    milliseconds: 0
                - data: {}
                  target:
                    entity_id:
                      - light.tagreader_garage_led
                      - light.tagreader_bedroom_led
                      - light.tagreader_frontdoor_led
                  action: light.turn_off
                - delay:
                    hours: 0
                    minutes: 0
                    seconds: 1
                    milliseconds: 0
mode: restart
